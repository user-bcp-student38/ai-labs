quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false

# Secreto de firma de los JWT de sesión. El valor por defecto es solo para
# desarrollo/laboratorio local; en cualquier otro entorno debe venir de la
# variable de entorno AUTH_JWT_SECRET (gestor de secretos), nunca hardcodeado.
auth.jwt.secret=${AUTH_JWT_SECRET:workshop-dev-only-secret-do-not-use-in-prod}
